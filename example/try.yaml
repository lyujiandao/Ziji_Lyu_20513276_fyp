# dataset paths
input_path: 
	- ./example/Fold1
	- ./example/Fold2
	- ./example/Fold3
output_path: ./example/output/preprocessing

# basic setups
patch_size: 1024
patch_overlap: 6.25
target_mag: 40
processes: 8
overwrite: True

# macenko stain normalization
normalize_stains: True

# finding patches
min_intersection_ratio: 0.05
